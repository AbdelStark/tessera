[package]
name = "tessera-pcs"
description = "The streaming advice commitment, the persistent weight commitment, openings and the hiding budget (RFC-0011, RFC-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: seeded masking randomness, so tests are reproducible. A release build with it fails to compile.
test-rng = []

[dependencies]
tessera-field = { path = "../tessera-field" }

[dev-dependencies]
serde_json = "1"
# The verifier's independent NTT, for the differential test `tests/verifier.rs` (DEP-2).
tv-field = { path = "../../verifier/crates/tv-field" }

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
