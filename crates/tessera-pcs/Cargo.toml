[package]
name = "tessera-pcs"
description = "The streaming advice commitment, the persistent weight commitment, openings and the hiding budget (RFC-0011, RFC-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: seeded masking randomness, so tests are reproducible. A release build with it fails to compile.
test-rng = []

[dependencies]
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }

[dev-dependencies]
serde_json = "1"
# The verifier's independent opening checks, field and hashing: every opening the tests produce
# is checked by `tv_core::opening`, and `tests/verifier.rs` checks the NTT against `tv-field`'s
# (DEP-2).
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "commitment"
harness = false

[lints]
workspace = true
