[package]
name = "tessera-pcs"
description = "The streaming advice commitment, the persistent weight commitment, openings and the hiding budget (RFC-0011, RFC-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: seeded masking randomness, so tests are reproducible. A release build with it fails to compile.
test-rng = []

[dependencies]
# The operating system's CSPRNG, for the weights' masks seed (06 §7). 0.3 is in the lockfile
# already; `std` converts its error into `io::Error`.
getrandom = { version = "0.3", features = ["std"] }
tessera-codec = { path = "../tessera-codec" }
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }

[dev-dependencies]
tessera-bench = { path = "../tessera-bench" }
allocation-counter = "0.8"
serde_json = "1"
# The verifier's independent opening checks, field and hashing: every opening the tests produce
# is checked by `tv_core::opening`, and `tests/verifier.rs` checks the NTT against `tv-field`'s
# (DEP-2). `tests/weights_opening.rs` checks the weights' openings with a verifier built from
# `tv-field`, `tv-hash`, `tv-codec`'s `WeightCommitmentPublic` and `tv_core::sumcheck::eq`,
# and feeds the real fold/column answers to `tv_core::weights` (DEP-2).
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "commitment"
harness = false

[[bench]]
name = "weights_regenerated"
harness = false

[lints]
workspace = true
