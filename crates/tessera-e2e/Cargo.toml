[package]
name = "tessera-e2e"
description = "End-to-end and tamper tests across the prover and the independent verifier (docs/spec/07-testing-strategy.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Run this diagnostic's conformance tests in the default E2E suite as well.
[[example]]
name = "constraint-digest"
path = "examples/constraint_digest/main.rs"
test = true

# The SC-4 tamper corpus (07 §4): the generator of its base proofs, whose test checks that they
# regenerate byte for byte, and the corpus run through the verifier's public API.
[[example]]
name = "tamper-base"
path = "examples/tamper_base.rs"
required-features = ["tamper"]
test = true

[[test]]
name = "tamper_corpus"
required-features = ["tamper"]

[features]
# Seeded masks and the test-small parameter set: test-only features that release builds refuse.
tamper = ["tessera-prover/test-rng", "tessera-pcs/test-rng", "tv-core/test-params"]

[dev-dependencies]
blake3 = "1"
serde_json = "1"
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-gadgets = { path = "../tessera-gadgets" }
tessera-hash = { path = "../tessera-hash" }
tessera-ir = { path = "../tessera-ir" }
tessera-logup = { path = "../tessera-logup" }
tessera-poly = { path = "../tessera-poly" }
tessera-pcs = { path = "../tessera-pcs" }
tessera-protocol = { path = "../tessera-protocol" }
tessera-prover = { path = "../tessera-prover" }
tessera-sumcheck = { path = "../tessera-sumcheck" }
tessera-tables = { path = "../tessera-tables" }
tessera-witness = { path = "../tessera-witness" }

# Diagnostic differential checks consume the verifier only as dev-dependencies (DEP-2).
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }
tv-tables = { path = "../../verifier/crates/tv-tables" }
tv-testkit = { path = "../../verifier/crates/tv-testkit" }
xtask = { path = "../../xtask" }

[lints]
workspace = true
