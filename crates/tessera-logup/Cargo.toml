[package]
name = "tessera-logup"
description = "The LogUp-GKR lookup prover with multiplicities and tuple tables (RFC-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tessera-field = { path = "../tessera-field" }
tessera-poly = { path = "../tessera-poly" }
tessera-sumcheck = { path = "../tessera-sumcheck" }

[dev-dependencies]
serde_json = "1"
tessera-codec = { path = "../tessera-codec" }
tessera-hash = { path = "../tessera-hash" }
# The verifier's independent LogUp roots, tree levels and leaf checks, field and transcript:
# every proof the tests produce is checked by them (DEP-2).
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
