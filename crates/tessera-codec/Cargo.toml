[package]
name = "tessera-codec"
description = "Tessera Canonical Encoding (TCE), the artifact envelope and the schema registry (RFC-0003)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# zeroize: the envelope hasher's block buffer holds payload bytes, secret-class ones included.
blake3 = { version = "1.8", features = ["zeroize"] }
# The random part of a new file's name in `envelope::write_file` (06 §7). 0.3 is in the lockfile
# already; `std` converts its error into `io::Error`.
getrandom = { version = "0.3", features = ["std"] }
tessera-codec-derive = { path = "../tessera-codec-derive" }
# Events and spans of public data (05 §2, §5). `trace` events are compiled out of release builds.
tracing = { version = "0.1.44", default-features = false, features = ["std", "release_max_level_debug"] }
# 1.9 for `optimization_barrier`, which keeps the zeros a `SecretBuf` writes as it frees.
zeroize = "1.9"

[dev-dependencies]
allocation-counter = "0.8"
proptest = "1"
serde_json = "1"
trybuild = "1"

[lints]
workspace = true
