[package]
name = "tessera-field"
description = "The Goldilocks field Fp, its quadratic extension Fp2, NTT roots and the field traits (RFC-0002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The code-generation probes of `cargo xtask check-branchless` (`src/probe.rs`); no crate enables
# it.
codegen-probe = []

[dependencies]
tessera-codec = { path = "../tessera-codec" }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints]
workspace = true
