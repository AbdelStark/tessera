[package]
name = "tessera-bench"
description = "The executable cost model, unit-cost microbenchmarks and their reports (RFC-0020)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The GPU unit-cost microbenchmarks (examples/gpu_unit_costs.rs, RFC-0020 'Measurement
# protocol'): needs the CUDA toolkit and a CUDA device (DEP-5).
gpu = ["dep:tessera-gpu", "tessera-gpu/gpu"]

[dependencies]
serde_json = "1"
tessera-gpu = { path = "../tessera-gpu", optional = true }

[dev-dependencies]
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }
tessera-ir = { path = "../tessera-ir" }
tessera-logup = { path = "../tessera-logup" }
tessera-pcs = { path = "../tessera-pcs" }
tessera-prover = { path = "../tessera-prover" }
tessera-protocol = { path = "../tessera-protocol" }
tessera-sumcheck = { path = "../tessera-sumcheck" }
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }

[[example]]
name = "gpu_unit_costs"
required-features = ["gpu"]

[[bench]]
name = "primitives"
harness = false

[lints]
workspace = true
