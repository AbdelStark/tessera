[package]
name = "tessera-witness"
description = "The CPU reference integer engine for D, which is the bit-exact oracle, and the witness streaming interface (RFC-0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-gadgets = { path = "../tessera-gadgets" }
tessera-ir = { path = "../tessera-ir" }
tessera-tables = { path = "../tessera-tables" }

[dev-dependencies]
# Counts the current thread's allocations: what a regenerated tile holds (tests/memory.rs).
allocation-counter = "0.8"
serde_json = "1"

[features]
# Test-only: dumps secret tensors for debugging (OBS-4). A release build with it fails to compile.
unsafe-debug-dump = []

[lints]
workspace = true
