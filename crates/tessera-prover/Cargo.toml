[package]
name = "tessera-prover"
description = "Orchestration of the witness pass, commitments, stages and openings over the CPU and GPU backends (RFC-0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-gadgets = { path = "../tessera-gadgets" }
tessera-ir = { path = "../tessera-ir" }
tessera-logup = { path = "../tessera-logup" }
tessera-poly = { path = "../tessera-poly" }
tessera-sumcheck = { path = "../tessera-sumcheck" }
tessera-tables = { path = "../tessera-tables" }
tessera-witness = { path = "../tessera-witness" }

[dev-dependencies]
serde_json = "1"
tessera-hash = { path = "../tessera-hash" }
# The weight layout and the transcript schedule, whose conformance vectors' sizes the prover's
# derivations give (tests/transcript_sizes.rs).
tessera-pcs = { path = "../tessera-pcs" }
tessera-protocol = { path = "../tessera-protocol" }
# The verifier's independent LogUp checks, tables, field, codec and transcript: the leaf stage's
# LogUp proofs are checked by them before the in-test split check (DEP-2).
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }
tv-tables = { path = "../../verifier/crates/tv-tables" }

[features]
# Test-only: seeded masking randomness, so tests are reproducible. A release build with it fails to compile.
test-rng = []
# Test-only: dumps secret tensors for debugging (OBS-4). A release build with it fails to compile.
unsafe-debug-dump = []

[lints]
workspace = true
