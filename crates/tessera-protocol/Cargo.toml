[package]
name = "tessera-protocol"
description = "Message types, session state machines, parameter sets, the soundness calculator and audit sampling (RFC-0014, RFC-0016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: accepts the `test-small` parameter set, which certifies nothing. A release build with it fails to compile.
test-params = []

[dependencies]
# The operating system's CSPRNG, the source of every share, session id and column query (06 §7).
getrandom = "0.4"
tessera-codec = { path = "../tessera-codec" }
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }
tessera-ir = { path = "../tessera-ir" }
tessera-sumcheck = { path = "../tessera-sumcheck" }

[dev-dependencies]
allocation-counter = "0.8"
proptest = "1"
serde_json = "1"

[lints]
workspace = true
