[package]
name = "tessera-protocol"
description = "Message types, session state machines, parameter sets, the soundness calculator and audit sampling (RFC-0014, RFC-0016)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: accepts the `test-small` parameter set, which certifies nothing. A release build with it fails to compile.
test-params = []
# Network transport is opt-in; directory users do not link a TLS stack.
tls = ["dep:rustls"]

[dependencies]
# The operating system's CSPRNG, the source of every share, session id and column query (06 §7).
getrandom = "0.4"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
tessera-codec = { path = "../tessera-codec" }
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }
tessera-ir = { path = "../tessera-ir" }
tessera-pcs = { path = "../tessera-pcs" }
tessera-sumcheck = { path = "../tessera-sumcheck" }

[dev-dependencies]
allocation-counter = "0.8"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
serde_json = "1"
# The verifier's independent soundness calculator, compared across 1,000 random profiles (#110), and
# its audit sampling, across 1,000 seeds (#151): DEP-2.
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }

[lints]
workspace = true
