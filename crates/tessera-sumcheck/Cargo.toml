[package]
name = "tessera-sumcheck"
description = "The sumcheck engine, GKR layer protocols and stage batching (RFC-0010, RFC-0013)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: seeded masking randomness, so tests are reproducible. A release build with it fails to compile.
test-rng = []

[dependencies]
tessera-codec = { path = "../tessera-codec" }
tessera-field = { path = "../tessera-field" }
tessera-hash = { path = "../tessera-hash" }
tessera-poly = { path = "../tessera-poly" }

[dev-dependencies]
serde_json = "1"
# The verifier's independent sumcheck checks, field and transcript: every proof the tests produce
# is checked by them (DEP-2).
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "matmul"
harness = false

[lints]
workspace = true
