[package]
name = "tessera-scoring"
description = "The sampler PRF stream, the predictor definitions and the Û accounting (RFC-0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# RFC-0017 'Sampler PRF': AES-128, constant-time in software (fixsliced) or AES-NI; `zeroize`
# clears the key schedule on drop (05 §3 OBS-2).
aes = { version = "0.8", features = ["zeroize"] }
# RFC-0061 'The stream': SHA-256's compression function alone, on a padded class input this crate
# builds in a clearing buffer, so no hasher's buffer keeps a copy of the key or the prompt.
sha2 = { version = "0.10", features = ["compress"] }
# OBS-6: the hashes' state words, derived from the key, are cleared where they are held.
zeroize = "1.9"
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-gadgets = { path = "../tessera-gadgets" }
tessera-ir = { path = "../tessera-ir" }
tessera-poly = { path = "../tessera-poly" }
tessera-sumcheck = { path = "../tessera-sumcheck" }
tessera-tables = { path = "../tessera-tables" }
tessera-witness = { path = "../tessera-witness" }

[dev-dependencies]
tessera-anchor = { path = "../tessera-anchor" }
tessera-hash = { path = "../tessera-hash" }
tessera-logup = { path = "../tessera-logup" }
tv-core = { path = "../../verifier/crates/tv-core" }
tv-field = { path = "../../verifier/crates/tv-field" }
tv-hash = { path = "../../verifier/crates/tv-hash" }

[lints]
workspace = true
