[package]
name = "tessera-scoring"
description = "The sampler PRF stream, the predictor definitions and the Û accounting (RFC-0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# RFC-0017 'Sampler PRF': AES-128, constant-time in software (fixsliced) or AES-NI; `zeroize`
# clears the key schedule on drop (05 §3 OBS-2).
aes = { version = "0.8", features = ["zeroize"] }
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-field = { path = "../tessera-field" }
tessera-gadgets = { path = "../tessera-gadgets" }
tessera-ir = { path = "../tessera-ir" }
tessera-poly = { path = "../tessera-poly" }
tessera-tables = { path = "../tessera-tables" }

[lints]
workspace = true
