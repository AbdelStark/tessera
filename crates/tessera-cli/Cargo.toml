[package]
name = "tessera-cli"
description = "The tessera command-line interface (docs/spec/02-public-api.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
# Without colors and suggestions: no terminal detection, no extra crates.
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
tessera-anchor = { path = "../tessera-anchor" }
tessera-bench = { path = "../tessera-bench" }
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-ir = { path = "../tessera-ir" }
tessera-pcs = { path = "../tessera-pcs" }
tessera-protocol = { path = "../tessera-protocol" }
tessera-prover = { path = "../tessera-prover" }
tessera-hash = { path = "../tessera-hash" }
# The subscriber of 05 §2: the span registry only, with no formatting, ANSI or filter crates.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
# Host-owned optional trace export (05 §5). No exporter or HTTP runtime in default builds.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-json", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "native-tls-no-alpn"], optional = true }

[features]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:reqwest"]
# Test-only: `prove --test-mask-seed` pins the masks, for OBS-5's reproducibility test. A release
# build with it fails to compile (RFC-0001 'Cargo features').
test-rng = ["tessera-prover/test-rng"]

[dev-dependencies]
allocation-counter = "0.8"
# The integration example's simulated issuer draws a public nonce (RFC-0061).
getrandom = { version = "0.3", features = ["std"] }
tessera-scoring = { path = "../tessera-scoring" }
# Independent parser for the Prometheus exposition contract (#177).
prometheus-parse = "0.2.5"
# The independent verifier's decoders and statement digest, so that `tests/prove_sample.rs`
# builds the expected statement apart from the prover (DEP-2).
tv-codec = { path = "../../verifier/crates/tv-codec" }
tv-core = { path = "../../verifier/crates/tv-core" }
tv-hash = { path = "../../verifier/crates/tv-hash" }
# The JSON Schema validator of `spec/schemas/` (tests/run_manifest.rs, tests/prove_sample.rs).
xtask = { path = "../../xtask" }

[[test]]
name = "run_manifest"
required-features = ["test-rng"]

[lints]
workspace = true
