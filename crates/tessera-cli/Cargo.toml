[package]
name = "tessera-cli"
description = "The tessera command-line interface (docs/spec/02-public-api.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
# Without colors and suggestions: no terminal detection, no extra crates.
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
tessera-anchor = { path = "../tessera-anchor" }
tessera-bench = { path = "../tessera-bench" }
tessera-codec = { path = "../tessera-codec" }
tessera-compiler = { path = "../tessera-compiler" }
tessera-ir = { path = "../tessera-ir" }
tessera-pcs = { path = "../tessera-pcs" }
tessera-protocol = { path = "../tessera-protocol" }
tessera-prover = { path = "../tessera-prover" }
tessera-hash = { path = "../tessera-hash" }
# The subscriber of 05 §2: the span registry only, with no formatting, ANSI or filter crates.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[features]
# Test-only: `prove --test-mask-seed` pins the masks, for OBS-5's reproducibility test. A release
# build with it fails to compile (RFC-0001 'Cargo features').
test-rng = ["tessera-prover/test-rng"]

[dev-dependencies]
# The JSON Schema validator of `spec/schemas/` (tests/run_manifest.rs).
xtask = { path = "../../xtask" }

[[test]]
name = "run_manifest"
required-features = ["test-rng"]

[lints]
workspace = true
