# Secret-class values leave `Secret<T>` only in the modules 05 §3 OBS-1 names: the witness
# engine, gadget witness generation, commitment encoding, key handling and the proving engines'
# entry points. Those modules opt in with `#[allow(clippy::disallowed_methods)]`, and `cargo xtask
# lint` accepts that allowance only in the readers `secret-access.toml` lists. This stays the only
# clippy configuration outside `verifier/`, which `cargo xtask lint` checks: clippy reads the
# nearest one, so another would switch these rules off for the crates below it.
disallowed-methods = [
    { path = "tessera_codec::Secret::expose_secret", reason = "secret-class values leave Secret<T> only in the modules listed in secret-access.toml (05 §3 OBS-1)" },
    { path = "tessera_codec::Secret::expose_secret_mut", reason = "secret-class values leave Secret<T> only in the modules listed in secret-access.toml (05 §3 OBS-1)" },
]
# OBS-6: a `BufReader` reads ahead into a buffer it frees uncleared, so secret-class file bytes
# would outlive their reader. Read a `File` through `envelope::verify`, or into a `SecretBuf`.
disallowed-types = [
    { path = "std::io::BufReader", reason = "read-ahead leaves file bytes, secret-class ones included, in an uncleared buffer (05 §3 OBS-6); read a File through envelope::verify or into a SecretBuf" },
]
