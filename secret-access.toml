# The files that compute on secret-class values (05 §3 OBS-1): the witness engine, gadget witness
# generation, commitment encoding and key handling; the proving engines that compute on
# secret-class tables; and the wrapper itself and its tests.
#
# A reader takes values out of `Secret<T>`. Only a reader may name `Secret::expose_secret` or
# `expose_secret_mut`, and opt back in to the call with `#[allow(clippy::disallowed_methods)]`
# against the rule in `clippy.toml`; every reader names one. A borrower (`borrows = true`)
# computes on tables a reader lends it, by reference and for the length of a call, such as a
# proving engine's kernel: it names no accessor and switches no rule off. `cargo xtask lint`
# rejects an accessor or the allowance anywhere but in a reader, and an entry that does not fit
# its kind.
#
# A listed file keeps the values to itself: no function, trait impl or exported macro of it hands
# a secret-class value, or a reference to it, to code outside this list, beyond arithmetic on
# single values. It keeps no copy past a call, except what it derives, which it holds in a
# `SecretBuf` that clears its memory (OBS-6).

