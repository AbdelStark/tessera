# The files allowed to read secret-class values out of `Secret<T>` (05 §3 OBS-1): the witness
# engine, gadget witness generation, commitment encoding and key handling, plus the wrapper
# itself and its tests.
#
# Only a file listed here may name `Secret::expose_secret` or `expose_secret_mut`, and opt back
# in to the call with `#[allow(clippy::disallowed_methods)]` against the rule in `clippy.toml`.
# `cargo xtask lint` rejects both anywhere else. A listed file keeps the value to itself: no
# function, trait impl or exported macro of it hands the value, or a reference to it, to code
# outside this list.

[[module]]
path = "crates/tessera-codec/src/secret.rs"
reason = "defines Secret and its accessors"

[[module]]
path = "crates/tessera-codec/tests/secret.rs"
reason = "tests of the Secret wrapper itself: they read values back to check them"
