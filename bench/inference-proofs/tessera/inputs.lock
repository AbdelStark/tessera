# RFC-0014 B2: every external input the fetch stage downloads, one per line:
# <name>	<url>	sha256:<hex>
# The upstream source at the pin: the digest is of `git archive --format=tar HEAD`, which the fetch
# stage recomputes after checking `git rev-parse HEAD` (INV-ADAPTER-2). Its Rust crates come through
# Cargo.lock and Cargo.lock under verifier/ (checksums) and its Python packages through
# python/uv.lock (hashes), each fetched by the locked tool in the fetch stage.
