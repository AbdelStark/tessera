[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AbdelStark/tessera"
# Nothing is published while the repository is private (09 §9).
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Libraries never print: output goes through typed results and redacted telemetry (05 §3).
# Binaries opt out locally.
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
# Integer and field code is exercised by large property tests; keep overflow checks and
# debug assertions, but optimize enough that those tests stay fast.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
