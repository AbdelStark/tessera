[package]
name = "padblocks"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "EXP-0009: analytic padding blocks against the materialized power-of-two padding of product forests (research/, a dependency of nothing)"

[[bin]]
name = "padblocks"
path = "src/main.rs"

# Its own workspace: the root workspace and its lockfile stay untouched (research/README.md rule 2).
[workspace]

[dependencies]
# The production forest prover (the anchor), its labels and transcript trait, and the field,
# polynomial and transcript crates the harness's own prover drives, unmodified.
tessera-codec = { path = "../../../crates/tessera-codec" }
tessera-field = { path = "../../../crates/tessera-field" }
tessera-hash = { path = "../../../crates/tessera-hash" }
tessera-poly = { path = "../../../crates/tessera-poly" }
tessera-sumcheck = { path = "../../../crates/tessera-sumcheck" }
# The independent checks: the production proof of every configuration is verified by the
# verifier's own level checks on a tv-hash transcript, as the sumcheck crate's tests do (DEP-2 is
# a rule on prover crates; this research crate is a dependency of nothing).
tv-core = { path = "../../../verifier/crates/tv-core" }
tv-field = { path = "../../../verifier/crates/tv-field" }
tv-hash = { path = "../../../verifier/crates/tv-hash" }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
