# Fuzzing of the verifier's decoders and proof checks (verifier/fuzz/README.md): every target for
# ten minutes under AddressSanitizer, seeded from spec/vectors/, on demand and, called by
# nightly.yml, every night: the hour of 07 §2 across its six targets. ci.yml calls its check
# alone on every code change, since no other job compiles the fuzz crate (#481). Third-party actions are
# pinned by commit SHA (TB-4 in docs/spec/06-security.md).
name: fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: true
        default: "600"
  workflow_call:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: string
        required: true
      check_only:
        description: Run the format, lints and allocation tests alone, without fuzzing
        type: boolean
        default: false
permissions:
  contents: read

# Called from ci.yml on commit lifecycle events (#532), this group is shared with the caller's
# ref and only a new commit cancels a check in progress.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2

defaults:
  run:
    working-directory: verifier/fuzz

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.targets.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # RUSTUP_TOOLCHAIN makes the pin of verifier/fuzz/rust-toolchain.toml apply everywhere,
      # including where the cache action runs rustc.
      - name: Install the fuzzing toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: verifier/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Allocation tests
        run: cargo test --locked
      - name: Complete recorded driver under allocation and deadline limits
        run: |
          cargo clippy --features test-params --all-targets --locked -- -D warnings
          cargo test --features test-params --test complete_oracles --test driver_work_allocation --test driver_deadline_allocation --locked
      - name: List the targets, one per fuzz_targets/<name>.rs
        id: targets
        run: |
          list=$(find fuzz_targets -maxdepth 1 -name '*.rs' -exec basename {} .rs \; | sort | jq -Rcn '[inputs]')
          echo "targets: $list"
          if [ "$list" = "[]" ]; then
            echo "no fuzz target under fuzz_targets/"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: check
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fuzzing toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: verifier/fuzz -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz ${{ env.CARGO_FUZZ_VERSION }} (crates.io, locked)
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Seed corpora from spec/vectors/
        run: python3 seeds.py "$RUNNER_TEMP/seeds"
      - name: Build under AddressSanitizer
        run: cargo fuzz build --features test-params "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          if ! [[ "$SECONDS_PER_TARGET" =~ ^[1-9][0-9]*$ ]]; then
            echo "seconds must be a positive integer, got '$SECONDS_PER_TARGET'"
            exit 1
          fi
          # seeds.py seeds the targets it knows; another starts from an empty directory.
          mkdir -p "corpus/$TARGET" "$RUNNER_TEMP/seeds/$TARGET"
          cargo fuzz run --features test-params "$TARGET" "corpus/$TARGET" "$RUNNER_TEMP/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -print_final_stats=1
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-failure
          path: verifier/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
