# Fast-build pull-request pipeline. Deeper, platform-specific and scheduled checks remain
# available through workflow_dispatch. Third-party actions are pinned by SHA (TB-4).
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Label events run only pr-policy.yml (#532), so ci.yml sees commit lifecycle events alone and a
# push or new commit cancels the branch's superseded run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'synchronize') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep the optimized test profile and its assertions; omit debug symbols in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check CI routing
        run: python3 -m unittest discover -s .github/scripts
      - name: Select the bootstrap pipeline
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            python3 .github/scripts/ci_scope.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: scope
    name: checks
    runs-on: ubuntu-24.04
    # About 2 minutes with code changes; the mask-rank gate adds 2 to 4 on two cores.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # rust-cache fingerprints every installed toolchain, including the runner image stable.
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            verifier -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: |
          cargo fmt --all --check
          (cd verifier && cargo fmt --all --check)
      - name: Clippy
        if: needs.scope.outputs.code == 'true'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p tessera-protocol --features tls --all-targets --locked -- -D warnings
          (cd verifier && cargo clippy --workspace --all-targets --locked -- -D warnings)
      # Invoke xtask directly so reviewed repository configuration cannot rewrite the cargo alias.
      - name: Repository policies
        run: cargo run --locked --quiet -p xtask -- lint
      # The research knowledge base's citations, ledger counters and frozen pre-registrations.
      - name: Research knowledge base (research/README.md)
        run: |
          python3 -I research/tools/check_kb.py
          python3 -I research/tools/check_preregistration.py
      - name: Verifier isolation (RFC-0001)
        run: cargo run --locked --quiet -p xtask -- check-isolation
      - name: Test-only features fail release builds (RFC-0001)
        if: needs.scope.outputs.code == 'true'
        run: cargo run --locked --quiet -p xtask -- check-test-features
      # About 260 s of CPU over the conformance and 405B claim lists, every request and both
      # readings of #554, which the gate spreads over the runner's cores.
      - name: Every mask row's revealed points are independent (R10, #488)
        if: needs.scope.outputs.code == 'true'
        run: cargo run --locked --quiet -p xtask -- check-mask-rank
      - name: Field operations compile branch-free on x86_64 (INV-ARCH-2)
        if: needs.scope.outputs.code == 'true'
        run: cargo run --locked --quiet -p xtask -- check-branchless

  telemetry:
    name: telemetry (${{ matrix.feature }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        feature: [default, otel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain and syscall tracer
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y strace libssl-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: telemetry-${{ matrix.feature }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test optional export, exposition and unchanged logging
        env:
          TELEMETRY_FEATURE: ${{ matrix.feature }}
        run: |
          features=()
          if [ "$TELEMETRY_FEATURE" = otel ]; then features=(--features otel); fi
          cargo test -p tessera-cli --lib --test telemetry_export --test logging "${features[@]}" --locked
          cargo clippy -p tessera-cli --all-targets "${features[@]}" --locked -- -D warnings
      - name: Compile inside an isolated network namespace without a network syscall
        run: |
          # A refused connection must trip the check too. This negative control
          # proves that isolation alone cannot hide attempted telemetry (#177).
          sudo unshare --net -- strace -f -qq -e trace=network -o "$RUNNER_TEMP/network-control" python3 -c 'import socket; s=socket.socket(); s.connect_ex(("127.0.0.1", 4318))'
          test -s "$RUNNER_TEMP/network-control"
          sudo unshare --net -- strace -f -qq -e trace=network -o "$RUNNER_TEMP/network-default" env \
            OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces \
            "$PWD/target/debug/tessera" compile \
            --model spec/vectors/exact-cli/tiny-3-reference.d --params test-small \
            --max-log2-rows 18 --query-block 2 --out-dir "$RUNNER_TEMP/network-sandbox-output"
          if [ -s "$RUNNER_TEMP/network-default" ]; then
            cat "$RUNNER_TEMP/network-default"
            exit 1
          fi

  rust:
    name: rust (${{ matrix.workspace }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Checkpoint integration (#641): both exact-head runs exhausted 25m after 424
    # passing component tests and recorder checks, during the final NI/Live stage.
    # Allow the complete suite; test commands and protocol deadlines stay unchanged.
    timeout-minutes: ${{ matrix.workspace == 'prover' && 45 || 12 }}
    strategy:
      matrix:
        workspace: [prover, verifier]
    defaults:
      run:
        working-directory: ${{ matrix.workspace == 'prover' && '.' || 'verifier' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # rust-cache fingerprints every installed toolchain, including the runner image stable.
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace == 'prover' && '.' || 'verifier' }} -> target
          key: ${{ matrix.workspace }}
          cache-workspace-crates: true
      - name: Install Nextest 0.9.148 (release binary, SHA-256 pinned)
        run: |
          archive=cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/$archive"
          echo "223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.cargo/bin" cargo-nextest
      - name: Runtime library unit tests
        if: matrix.workspace == 'prover'
        run: cargo nextest run --workspace --exclude xtask --exclude tessera-bench --lib --locked
      - name: Streamed advice rows match scalar and frozen layout oracles (#630)
        if: matrix.workspace == 'prover'
        run: |
          cargo nextest run -p tessera-pcs --test source_rows --locked
          cargo nextest run -p tessera-compiler --test advice_layout --locked \
            -E 'test(every_model_source_location_point_zero_row_and_segment_matches_the_oracle)'
      - name: Public table and owned layout allocation regressions (#641)
        if: matrix.workspace == 'prover'
        run: |
          cargo test -p tessera-tables --lib --tests --locked -- --test-threads=1
          cargo test -p tessera-gadgets --test storage --locked -- --test-threads=1
          cargo test -p tessera-gadgets --lib rsqrt::memory --locked -- --test-threads=1
          cargo test -p tessera-prover --lib score_input --features test-rng,test-params --locked -- --test-threads=1
          cargo test -p tessera-prover --lib native::memory --locked -- --test-threads=1
          cargo test -p tessera-pcs --test layout --test request_slots --test weights_opening --locked -- --test-threads=1
      - name: Opt-in TLS 1.3 Live transport and adversarial framing checks (RFC-0014)
        if: matrix.workspace == 'prover'
        run: cargo test -p tessera-protocol --features tls --lib transport --locked
      - name: Build the real exact-mode CLI pair
        if: matrix.workspace == 'prover'
        run: |
          cargo build -p tessera-cli --locked
          (cd verifier && cargo build -p tv-cli --features tv-core/test-params --locked)
          echo "TESSERA_BIN=$PWD/target/debug/tessera" >> "$GITHUB_ENV"
          echo "TESSERA_VERIFY_BIN=$PWD/verifier/target/debug/tessera-verify" >> "$GITHUB_ENV"
      - name: Protocol, proof components and tiny-model integration
        if: matrix.workspace == 'prover'
        run: >-
          cargo nextest run --locked --tests -E 'kind(test)'
          -p tessera-codec -p tessera-field -p tessera-hash
          -p tessera-protocol -p tessera-prover -p tessera-e2e
      - name: A sampled audit from the recorder's logs to the verifier's verdict (02 §2.2)
        if: matrix.workspace == 'prover'
        run: cargo nextest run --locked -p tessera-cli --test prove_sample
      - name: Serving integration guide, reference recorder and sampler conformance
        if: matrix.workspace == 'prover'
        run: |
          cargo test -p tessera-scoring --test sampler --test exact --locked
          cargo test -p tessera-witness --test engine the_engine_computes_the_conformance_vectors --locked
          cargo nextest run -p tessera-witness --test tensors --test request_slots --test multiplicities --test checkpoint_memory --test source_memory --test source_validation_memory --test source_tile_memory --locked
          cargo test -p tessera-cli --example recorder_integration --test recorder --locked
          cargo run -p tessera-cli --example recorder_integration --locked -- \
            "$TESSERA_BIN" "$RUNNER_TEMP/recorder-integration"
      - name: Accept real CPU proofs in NI and fresh Live sessions
        if: matrix.workspace == 'prover'
        run: >-
          cargo nextest run --locked -p tessera-prover --test model_leaf
          --features test-rng,tv-core/test-params -E 'test(complete_runtime_cpu_proofs) | test(public_cpu_api)'
      - name: Independent verifier tests in parallel
        if: matrix.workspace == 'verifier'
        run: cargo nextest run --workspace --lib --tests --locked
      - name: Independent CLI accepts the real CPU proof and rejects tampering
        if: matrix.workspace == 'prover'
        run: |
          cargo test -p tessera-prover --test model_leaf --features test-rng,tv-core/test-params --locked public_cli_binary -- --ignored
      - name: Test-parameter unit and claim validation coverage
        if: matrix.workspace == 'verifier'
        run: cargo nextest run -p tv-core --features test-params --lib --test claims_validation --locked
      - name: The verifier CLI's logs and run manifest through accepting checks (05 §2, §6)
        if: matrix.workspace == 'verifier'
        run: cargo nextest run -p tv-cli --features tv-core/test-params --tests --locked

  # SC-4 (07 §4): every mutation of a valid tiny proof yields its predeclared verdict.
  # The fuzz crate is its own workspace on its own toolchain: its format, lints and allocation
  # tests, which no other job compiles (#481).
  fuzz:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: fuzz crate
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: "1"
      check_only: true

  tamper:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: tamper corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # rust-cache fingerprints every installed toolchain, including the runner image stable.
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            verifier -> target
          key: tamper
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The independent oracle reproduces the corpus
        run: python3 -I -B spec/vectors/tamper/generate.py --check
      # The workspace Clippy step builds no test-only features, so these targets are linted here.
      - name: Clippy, with the test-only features the corpus needs
        run: |
          cargo clippy --locked -p tessera-e2e --features tamper --all-targets -- -D warnings
          (cd verifier && cargo clippy --locked -p tv-core --features test-params --all-targets -- -D warnings)
      - name: The base proofs regenerate byte for byte; NI cases through the public verifier API
        run: cargo test --locked -p tessera-e2e --features tamper --test tamper_corpus --example tamper-base
      - name: Every case, NI and recorded Live, against the independent verifier
        working-directory: verifier
        run: cargo test --locked -p tv-core --features test-params --lib driver::corpus

  # OBS-5 (05 §6): identical runs write identical manifests, with the masks pinned (test-rng).
  manifest:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: run manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # rust-cache fingerprints every installed toolchain, including the runner image stable.
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: manifest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace Clippy step builds no test-only features, so this target is linted here.
      - name: Clippy, with the test-only feature
        run: cargo clippy --locked -p tessera-cli --features test-rng --all-targets -- -D warnings
      - name: Identical runs write identical manifests; every manifest follows its schema
        run: cargo test --locked -p tessera-cli --features test-rng --test run_manifest

  cpu-api:
    name: CPU API acceptance
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cpu-api-test-params
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the independent verifier acceptance build
        run: cargo clippy -p tessera-prover --features test-params --test model_leaf --locked -- -D warnings
      - name: Accept complete NI and Live CPU proofs with non-certifying parameters
        run: cargo test -p tessera-prover --features test-params --test model_leaf public_cpu_api_ --locked -- --test-threads=2

  test:
    name: test
    needs: [scope, rust, fuzz, tamper, manifest, cpu-api]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Both workspaces, the fuzz crate, the tamper corpus and the run manifest passed, or only documentation changed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          RESULT: ${{ needs.rust.result }}
          FUZZ: ${{ needs.fuzz.result }}
          TAMPER: ${{ needs.tamper.result }}
          MANIFEST: ${{ needs.manifest.result }}
          CPU_API: ${{ needs.cpu-api.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$CODE" = true ]; then
            test "$RESULT" = success
            test "$FUZZ" = success
            test "$TAMPER" = success
            test "$MANIFEST" = success
            test "$CPU_API" = success
          else
            test "$CODE" = false
            test "$RESULT" = skipped
            test "$FUZZ" = skipped
            test "$TAMPER" = skipped
            test "$MANIFEST" = skipped
            test "$CPU_API" = skipped
          fi

  python:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.18"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install from the lockfile, with CPU PyTorch (RFC-0005 'Python packaging')
        run: uv sync --locked --extra cpu
      - name: Lint
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
      - name: Type-check (strict, from pyproject.toml)
        run: uv run --no-sync pyright
      - name: Test
        run: uv run --no-sync pytest

  constraint-digest:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: constraint-digest
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          # rust-cache fingerprints every installed toolchain, including the runner image stable.
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Independent constraint-system digest conformance (RFC-0007)
        run: |
          cargo test -p tessera-e2e --example constraint-digest --locked
          cargo run -p tessera-e2e --example constraint-digest --locked -- --model tiny-2-servable --n 1
