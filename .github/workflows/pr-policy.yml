# Pull-request policies that depend on the change, not on the tree (docs/spec/09 §5, §6): a
# changelog entry for every change to a release train, and a DCO sign-off on every commit.
# Isolated from ci.yml (#532) so that adding or removing the `no-changelog` label re-runs only
# this check and can never skip or override a failing code check. Event data reaches the shell
# through environment variables, never by interpolation (TB-4).
#
# No concurrency group (#351, #507, #508): a pull request opened with labels fires one `labeled`
# event per label, and GitHub cancels pending runs within a shared group, leaving a required check
# BLOCKED although a later run passed. Every run finishes instead; each reads the same commits and
# takes under a minute.
name: pr-policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for the changelog and DCO check
        required: true
        default: origin/main
      labels:
        description: Comma-separated PR labels, such as no-changelog
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request events, check out the PR head explicitly with full history to its base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustup default "$channel"
          rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          key: xtask
          cache-workspace-crates: true
      - name: Changelog entry and DCO sign-off (09 §5, §6)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
          LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || inputs.labels }}
        run: cargo run --locked --quiet -p xtask -- check-pr --base "$BASE_REF" --labels "$LABELS"
