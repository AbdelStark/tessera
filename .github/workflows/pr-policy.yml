# Pull-request policies that depend on the change, not on the tree (docs/spec/09 §5, §6): a
# changelog entry for every change to a release train, and a DCO sign-off on every commit.
# A separate workflow so that adding or removing the `no-changelog` label re-runs only this
# check. Event data reaches the shell through environment variables, never by interpolation.
name: pr-policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of the pull request itself, with enough history to reach its base.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: Changelog entry and DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: cargo run --locked --quiet -p xtask -- check-pr --base "$BASE_SHA" --labels "$LABELS"
