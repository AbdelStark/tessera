# Standalone manual rerun of the changelog and DCO check. Pull requests run it in ci.yml.
name: pr-policy

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for the changelog and DCO check
        required: true
        default: origin/main
      labels:
        description: Comma-separated PR labels, such as no-changelog
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: Changelog entry and DCO sign-off
        env:
          BASE_REF: ${{ inputs.base }}
          LABELS: ${{ inputs.labels }}
        run: cargo run --locked --quiet -p xtask -- check-pr --base "$BASE_REF" --labels "$LABELS"
