# Build release candidates; publication remains the reviewed checklist's final step (09 §9).
name: release

on:
  push:
    tags: ['v*', 'verify-v*']
  pull_request:
    paths: ['.github/workflows/release.yml', '.github/scripts/release.py', '.github/scripts/build_verifier.sh', '.github/scripts/test_release.py']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rehearsal tag (does not create a tag or a GitHub release)'
        required: true
        default: verify-v0.0.1-rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verifier: ${{ steps.metadata.outputs.verifier }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag, package version and release scripts
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || 'verify-v0.0.1-rc' }}
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          python3 -m unittest discover -s .github/scripts
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 .github/scripts/release.py prepare "$RELEASE_TAG" "${args[@]}" --out "$RUNNER_TEMP/release"
          python3 - "$RUNNER_TEMP/release/release.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          info = json.load(open(sys.argv[1]))
          print('verifier=' + str(info['verifier']).lower())
          print('tag=' + info['tag'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  verifier:
    needs: prepare
    if: needs.prepare.outputs.verifier == 'true'
    # Each matrix entry gets a separate clean hosted VM. No shared Cargo cache or outputs.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        builder: [1, 2]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deliberately different checkout paths; the container normalizes source paths.
          path: builder-${{ matrix.builder }}
      - name: Build the committed verifier in the pinned container
        working-directory: builder-${{ matrix.builder }}
        env:
          RUNNER_KIND: ${{ matrix.runner }}
        run: |
          target=x86_64-unknown-linux-gnu
          if [ "$RUNNER_KIND" = ubuntu-24.04-arm ]; then target=aarch64-unknown-linux-gnu; fi
          echo "RELEASE_TARGET=$target" >> "$GITHUB_ENV"
          bash .github/scripts/build_verifier.sh "$target" "$RUNNER_TEMP/verifier"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-${{ env.RELEASE_TARGET }}-${{ matrix.builder }}
          path: ${{ runner.temp }}/verifier
          if-no-files-found: error

  assemble:
    needs: [prepare, verifier]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.verifier.result == 'success' || needs.verifier.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.verifier == 'true'
        with:
          pattern: verifier-*
          path: ${{ runner.temp }}/builds
      - name: Compare independent builders (09 §9)
        if: needs.prepare.outputs.verifier == 'true'
        run: python3 .github/scripts/release.py compare "$RUNNER_TEMP/builds" --out "$RUNNER_TEMP/release"
      - name: Add committed source archive and its hash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          archive="tessera-$RELEASE_TAG.tar.gz"
          git archive --format=tar.gz --prefix=tessera/ HEAD > "$RUNNER_TEMP/release/$archive"
          cd "$RUNNER_TEMP/release"
          sha256sum "$archive" >> SHA256SUMS
          printf '\nSource archive SHA-256:\n\n```text\n' >> notes.md
          sha256sum "$archive" >> notes.md
          printf '```\n' >> notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  draft:
    needs: [prepare, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/release
      - name: Create a draft for checklist review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release/notes.md"
