# cargo-deny policy for the prover workspace (09 §7, TB-4 in 06 §3), run by
# `cargo xtask check-deps`. The verifier's stricter policy is verifier/deny.toml.

[graph]
all-features = true

[advisories]
yanked = "deny"
# An ignored advisory is a table `{ id = "RUSTSEC-...", reason = "..." }`; `cargo xtask lint`
# requires the reason.
ignore = []

[licenses]
# 09 §7: anything else needs an exception below, with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allow list is policy; not every license on it occurs in the graph.
unused-allowed-license = "allow"
# Exceptions are `[[licenses.exceptions]]` tables at the end of this file, each directly
# preceded by a `# Reason:` comment; `cargo xtask lint` checks both.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are unpublished path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
