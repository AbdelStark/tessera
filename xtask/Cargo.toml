[package]
name = "xtask"
description = "Repository automation for the Tessera workspaces, run as `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Lexing only (no syn): finds include macros and path attributes in verifier sources.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde_json = "1"
# The codec vectors come from the cases these crates define (`cargo xtask gen-vectors`).
tessera-codec = { path = "../crates/tessera-codec" }
tessera-field = { path = "../crates/tessera-field" }
# The IntegerModel vector comes from its Rust types, and the claim lists from the compiler.
tessera-compiler = { path = "../crates/tessera-compiler" }
tessera-ir = { path = "../crates/tessera-ir" }
# The weight commitment's golden vectors come from its Rust types; the states' bytes are laid
# out from RFC-0040's field list (src/weight_vectors.rs). Never with a test-only feature: a normal
# dependency's features reach every build of the workspace, release builds included.
tessera-pcs = { path = "../crates/tessera-pcs" }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
