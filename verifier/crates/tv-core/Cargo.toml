[package]
name = "tv-core"
description = "Claim-list validation and lowering, range re-derivation, schedule derivation and every proof check, run in the fixed order of RFC-0019."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: accepts the `test-small` parameter set, which certifies nothing. A release build with it fails to compile.
test-params = []

# The verifier's own field, codec, hash and tables, nothing else: the checks are written from the
# specifications without reference to the prover's crates (SP-6, RFC-0001).
[dependencies]
tv-codec = { path = "../tv-codec" }
tv-field = { path = "../tv-field" }
tv-hash = { path = "../tv-hash" }
tv-tables = { path = "../tv-tables" }

[dev-dependencies]
tv-testkit = { path = "../tv-testkit" }

[lints]
workspace = true
