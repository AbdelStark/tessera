# RFC-0019 'Dependencies': `tv-core` denies `clippy::arithmetic_side_effects` on size
# computations, and field arithmetic is exempt through its own types. `Fp` and `Fp2` operations
# are total (RFC-0002): they never overflow or panic. Every other type stays under the lint, so
# integer arithmetic on lengths and indices is checked or saturating.
#
# This file applies to this crate only, which cannot depend on the prover's crates, so it shadows
# none of the rules of the root clippy.toml that matter here.
arithmetic-side-effects-allowed = ["tv_field::Fp", "tv_field::Fp2"]
