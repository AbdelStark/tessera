[package]
name = "tv-hash"
description = "BLAKE3 domains, chained column digests, Merkle multiproofs, transcript replay and proof-of-work checks, and the SHA-256 Merkle tree of recorder logs (RFC-0004, RFC-0015)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# BLAKE3 and SHA-256 are written here, in safe Rust, from their specifications: no hash crate
# enters the trusted base (RFC-0019 'Dependencies').
[dependencies]
tv-field = { path = "../tv-field" }

[dev-dependencies]
tv-codec = { path = "../tv-codec" }
tv-testkit = { path = "../tv-testkit" }

# Release-mode throughput against the test kit's reference BLAKE3: `cargo bench -p tv-hash`.
[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
