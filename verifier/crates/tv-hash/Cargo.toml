[package]
name = "tv-hash"
description = "BLAKE3 domains, chained column digests, Merkle multiproofs, transcript replay and proof-of-work checks, the SHA-256 Merkle tree of recorder logs, and strict Ed25519 verification of their manifests (RFC-0004, RFC-0015, RFC-0060)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# BLAKE3, SHA-256, SHA-512 and Ed25519 are written here, in safe Rust, from their specifications:
# no hash or signature crate enters the trusted base (RFC-0019 'Dependencies').
[dependencies]
tv-field = { path = "../tv-field" }

[dev-dependencies]
tv-codec = { path = "../tv-codec" }
tv-testkit = { path = "../tv-testkit" }

# Release-mode throughput against the test kit's reference BLAKE3: `cargo bench -p tv-hash`.
[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
