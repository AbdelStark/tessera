# The verifier workspace: the whole trusted base of a Tessera audit (RFC-0019).
# It is a separate workspace with its own lockfile and must not depend on any crate under
# `crates/` (DEP-1); third-party packages come only from `allowlist.toml` (DEP-3).
# Both rules are enforced by `cargo xtask check-isolation` (RFC-0001 'Enforcement').

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The verifier release train is versioned independently of the prover (09 §1).
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AbdelStark/tessera"
# Nothing is published while the repository is private (09 §9).
publish = false

[workspace.lints.rust]
# The verifier admits no unsafe code in any crate (RFC-0001).
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Libraries never print; only `tv-cli` reports, and it opts out locally.
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
