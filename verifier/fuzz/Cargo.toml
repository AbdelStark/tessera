# cargo-fuzz targets for the verifier's decoders and proof checks (RFC-0003, RFC-0004 and RFC-0019
# 'Testing Strategy'); README.md says how to run them.
#
# This is its own workspace, outside the verifier's: libfuzzer-sys, the allocator of
# tests/allocation.rs and their dependencies never enter the verifier's dependency graph,
# lockfile or allowlist, and nothing here is part of `tessera-verify`.

[package]
name = "tv-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tv-codec = { path = "../crates/tv-codec" }
tv-core = { path = "../crates/tv-core" }
tv-field = { path = "../crates/tv-field" }
tv-hash = { path = "../crates/tv-hash" }
tv-testkit = { path = "../crates/tv-testkit" }

[dev-dependencies]
tv-tables = { path = "../crates/tv-tables" }
# A global allocator that counts and caps allocations, for tests/allocation.rs and the other
# tests/*_allocation.rs.
cap = { version = "0.1.2", features = ["stats"] }

# The allocation tests cap the process-wide allocator, so each runs alone on the main thread
# (#501): libtest's harness thread would allocate inside their capped windows.
[[test]]
name = "allocation"
harness = false

[[test]]
name = "driver_allocation"
harness = false

[[test]]
name = "gadgets_allocation"
harness = false

[[test]]
name = "hash_allocation"
harness = false

[[test]]
name = "logup_allocation"
harness = false

[[test]]
name = "opening_allocation"
harness = false

[[test]]
name = "protocol_allocation"
harness = false

[[test]]
name = "runtime_allocation"
harness = false

[[test]]
name = "sumcheck_allocation"
harness = false

[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multiproof"
path = "fuzz_targets/multiproof.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inclusion"
path = "fuzz_targets/inclusion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sumcheck"
path = "fuzz_targets/sumcheck.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit"
path = "fuzz_targets/audit.rs"
test = false
doc = false
bench = false
