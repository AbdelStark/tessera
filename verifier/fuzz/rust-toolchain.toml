[toolchain]
# cargo-fuzz instruments with nightly-only flags. Pinned so that local runs and
# .github/workflows/fuzz.yml fuzz with the same compiler; the verifier itself builds with
# verifier/rust-toolchain.toml. nightly-2026-01-15's AddressSanitizer runtime deadlocks before main
# on macOS 26 (get_dyld_hdr re-enters AsanInitFromRtl through malloc; #185).
channel = "nightly-2026-11-06"
components = ["clippy", "rustfmt"]
profile = "minimal"
